name: CI

# Runs on every push (and PRs from forks) — see the DX section of the README.
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both versions come from package.json — setup-bun reads `packageManager`
      # (falling back to `engines.bun`), setup-node reads `engines.node`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier (format check)
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript (strict typecheck)
        run: bun run typecheck

      - name: Knip (unused files/exports/dependencies)
        run: bun run knip

      - name: Tests (unit + API integration, in-memory DB)
        run: bun test

      - name: Production build
        run: bun run build

  # Builds the Docker image and pushes it to GHCR — only for pushes to main,
  # and only after the `ci` job above passed (docs/testbed/architecture.md §8).
  # A testbed repository changes only IMAGE.
  image:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hwahee/testbed-base
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
